name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soccerpedia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soccerpedia/constraints.txt
      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt 2>&1 | tee pip.log || {
            tail -n 25 pip.log | sed 's/^/::error::/'
            exit 1
          }
      - run: pytest -q
